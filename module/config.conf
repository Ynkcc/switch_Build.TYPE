# Switch Build.TYPE 配置
#
# enabled=1 : 开机时自动把下面的 TYPE 写入 sys.buildtype
#             （Zygisk 模块据此改写各 app 进程内的 android.os.Build.TYPE）
# enabled=0 : 开机不做任何设置，模块无副作用
#
# TYPE 只能取： user | userdebug | eng
#
# 提示：本文件随模块包一起更新会被重置为默认值。若想让它跨升级保留，
#       可把同样的内容放到 /data/adb/switch_build_type.conf（优先级更高）。
#
# 改完对之后新启动的进程立即生效，不需要重启：
#   su -c "/data/adb/modules/switch_build_type/switch userdebug"

enabled=1
TYPE=userdebug
